<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar — Travel Distribution Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sk-color: #eaeeef;
      --sk-shine: #f4f6f7;
      --border: #e5e7eb;
      --topbar-h: 52px;
      --breadcrumb-h: 40px;
    }

    body { font-family: 'Lato', sans-serif; background: #f4f6f7; }

    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position:  800px 0; }
    }

    .sk {
      background: linear-gradient(90deg,
        var(--sk-color) 25%,
        var(--sk-shine) 50%,
        var(--sk-color) 75%);
      background-size: 800px 100%;
      animation: shimmer 1.6s infinite linear;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* topbar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      height: var(--topbar-h);
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; gap: 16px;
    }
    .topbar-left  { display: flex; align-items: center; gap: 20px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    /* breadcrumb */
    .breadcrumb-bar {
      height: var(--breadcrumb-h);
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 24px; gap: 8px;
    }

    /* layout */
    .layout { display: flex; min-height: calc(100vh - var(--topbar-h) - var(--breadcrumb-h)); }

    .sidebar {
      width: 220px; flex-shrink: 0;
      background: #fff; border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex; flex-direction: column; gap: 6px;
    }

    .main {
      flex: 1; min-width: 0;
      padding: 24px;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* section card */
    .section-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 16px;
      overflow: hidden;
    }

    .card-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .card-header-left  { display: flex; align-items: center; gap: 12px; }
    .card-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* monthly calendar */
    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px;
      margin-bottom: 2px;
    }
    .cal-weeks { display: flex; flex-direction: column; gap: 2px; }
    .cal-week  { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .cal-cell  { height: 72px; border-radius: 2px; }
    .cal-cell--fade { opacity: 0.3; }

    /* weekly table */
    .weekly-grid {
      display: grid;
      grid-template-columns: 200px repeat(7, 1fr);
      gap: 2px;
    }
    .wk-cell { height: 32px; border-radius: 2px; }
    .wk-cell--hdr { height: 40px; }
    .wk-cell--section { height: 36px; opacity: 0.55; }
    .wk-row { display: contents; }
  </style>
</head>
